name: post-review
# code-review-ocr's top `merge`: post one review of every file's surviving
# findings (post-review.py beside this file). Its job token can post the review
# and nothing else.
on:
  workflow_dispatch:
    inputs:
      protocol_context:
        type: string
        required: false
permissions:
  contents: read
  pull-requests: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: post the review
        run: python3 "$SF_CONTROL_DIR/.github/workflows/post-review.py"
