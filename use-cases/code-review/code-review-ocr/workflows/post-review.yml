name: post-review
on:
  workflow_dispatch:
    inputs:
      protocol_context:
        type: string
        required: false
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Post the review on the MR
        run: python3 "$SF_CONTROL_DIR/.github/workflows/post_review.py"
