name: post-summary
# impl-feature-auto's last step: link the opened PR on the originating issue
# (post-summary.py beside this file). Its job token can read PRs and refs and
# comment on issues, nothing else.
on:
  workflow_dispatch:
    inputs:
      protocol_context:
        type: string
        required: false
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: link the PR on the issue
        run: python3 "$SF_CONTROL_DIR/.github/workflows/post-summary.py"
